<!DOCTYPE html>
<html lang="{{ lang }}" dir="{{ direction }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ clean_heading }} — AERO SUITE</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800&family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@600;700;800&display=swap');

        :root {
            /* Aero Ecosystem Depth Gradient & Hardware Palette */
            --bg-top: #1C2230;              /* Dark Slate / Obsidian */
            --bg-bottom: #000000;           /* Solid Pure Black (Aero Dock / HVAC extension) */
            
            /* Unified Accents */
            --cyan: #00D2FF;                /* Electric Cyan — Primary Accent */
            --crimson: #FF2D55;             /* Sport Crimson — Secondary Accent & Critical Alerts */
            
            /* Surfaces & Glassmorphism */
            --card-bg: rgba(28, 34, 48, 0.78);
            --card-bg-hover: rgba(38, 46, 64, 0.92);
            --card-border: rgba(0, 210, 255, 0.15); /* 1px hairline border */
            --card-border-hover: rgba(0, 210, 255, 0.45);
            --card-radius: 16px;            /* Standardized 16dp rounded corners */
            
            /* Typography */
            --text-heading: #FFFFFF;
            --text-main: #E2E8F0;
            --text-muted: #94A3B8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Inter', 'Cairo', 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: linear-gradient(180deg, var(--bg-top) 0%, #0F131C 50%, var(--bg-bottom) 100%) no-repeat fixed;
            color: var(--text-main);
            line-height: 1.8;
            padding: 32px 18px;
            display: flex;
            justify-content: center;
            text-align: {{ align }};
            min-height: 100vh;
        }

        h1, h2, h3, .header-title, .section-title {
            font-family: 'Space Grotesk', 'Cairo', 'Segoe UI', system-ui, sans-serif;
            letter-spacing: -0.2px;
        }

        .wrapper {
            width: 100%;
            max-width: 860px;
            display: flex;
            flex-direction: column;
            gap: 22px;
        }

        /* Header Card with Official ⚡ AERO SUITE Brand */
        .header-card {
            background: linear-gradient(135deg, rgba(32, 40, 58, 0.95) 0%, rgba(14, 18, 28, 0.90) 100%);
            border: 1px solid var(--card-border);
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.65), 0 0 30px rgba(0, 210, 255, 0.08);
            border-radius: var(--card-radius);
            padding: 26px 30px;
            position: relative;
            overflow: hidden;
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
        }

        /* Depth gradient accent line */
        .header-card::before {
            content: '';
            position: absolute;
            top: 0;
            right: 0;
            left: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--cyan) 0%, var(--crimson) 100%);
        }

        .header-content {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        /* ⚡ AERO SUITE Brand Element (Matching Desktop App) */
        .aero-brand-logo {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            align-self: flex-start;
        }

        .aero-bolt-svg {
            width: 22px;
            height: 22px;
            display: inline-block;
            filter: drop-shadow(0 0 8px rgba(255, 160, 72, 0.65));
            flex-shrink: 0;
        }

        .aero-brand-text {
            font-family: 'Space Grotesk', 'Segoe UI', system-ui, sans-serif;
            font-size: 21px;
            font-weight: 800;
            letter-spacing: 1.5px;
            color: var(--cyan);
            text-shadow: 0 0 16px rgba(0, 210, 255, 0.45);
            line-height: 1;
        }

        .header-title {
            color: var(--text-heading);
            font-size: 23px;
            font-weight: 800;
            line-height: 1.4;
            margin-top: 2px;
        }

        .header-sub {
            color: var(--text-muted);
            font-size: 13.5px;
        }

        /* Meta Grid */
        .meta-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 12px;
        }

        .meta-chip {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 12px 16px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            transition: all 0.25s ease;
            backdrop-filter: blur(12px);
        }

        .meta-chip:hover {
            background: var(--card-bg-hover);
            border-color: var(--card-border-hover);
            box-shadow: 0 4px 18px rgba(0, 210, 255, 0.12);
        }

        .meta-label {
            font-size: 12px;
            color: var(--text-muted);
            font-weight: 600;
        }

        .meta-value {
            font-size: 14px;
            color: var(--text-heading);
            font-weight: 700;
        }

        /* Cards & Sections */
        .card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.55);
            border-radius: var(--card-radius);
            padding: 24px 26px;
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            transition: all 0.25s ease;
        }

        .card:hover {
            border-color: var(--card-border-hover);
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.65), 0 0 20px rgba(0, 210, 255, 0.08);
        }

        .section-header {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
        }

        .section-pill {
            width: 34px;
            height: 34px;
            background: linear-gradient(135deg, var(--cyan), #0090B8);
            color: #0E1117;
            font-weight: 800;
            font-size: 16px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 15px rgba(0, 210, 255, 0.35);
            flex-shrink: 0;
            font-family: 'Space Grotesk', 'Cairo', sans-serif;
        }

        .section-title {
            color: var(--text-heading);
            font-size: 18px;
            font-weight: 800;
        }

        /* Step Cards */
        .steps-container {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .step-card {
            background: rgba(14, 18, 28, 0.82);
            border: 1px solid rgba(0, 210, 255, 0.12);
            border-radius: 14px;
            padding: 16px 20px;
            display: flex;
            align-items: flex-start;
            gap: 16px;
            transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .step-card:hover {
            border-color: var(--cyan);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 210, 255, 0.15);
        }

        .step-badge {
            width: 32px;
            height: 32px;
            background: rgba(0, 210, 255, 0.12);
            color: var(--cyan);
            border: 1px solid rgba(0, 210, 255, 0.35);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 15px;
            font-weight: 800;
            flex-shrink: 0;
            margin-top: 2px;
            box-shadow: 0 0 12px rgba(0, 210, 255, 0.2);
            font-family: 'Space Grotesk', 'Cairo', sans-serif;
        }

        .step-text {
            font-size: 15px;
            color: var(--text-main);
            line-height: 1.7;
            flex: 1;
        }

        .step-text mark {
            background: rgba(0, 210, 255, 0.16);
            color: var(--cyan);
            padding: 2px 7px;
            border-radius: 5px;
            font-weight: 700;
        }

        .step-main-title {
            font-weight: 700;
            color: var(--text-heading);
            margin-bottom: 8px;
        }

        .step-subline {
            font-size: 14px;
            color: var(--text-main);
            margin-top: 6px;
            padding-left: 10px;
            border-left: 2px solid rgba(0, 210, 255, 0.3);
            line-height: 1.6;
        }

        [dir="rtl"] .step-subline {
            padding-left: 0;
            padding-right: 10px;
            border-left: none;
            border-right: 2px solid rgba(0, 210, 255, 0.3);
        }

        .step-extra {
            color: var(--text-muted);
            font-size: 13px;
            margin-top: 6px;
        }

        /* Overview List */
        .overview-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .overview-para {
            font-size: 15px;
            color: var(--text-main);
            margin-bottom: 6px;
        }

        .list-item {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            padding: 9px 14px;
            background: rgba(14, 18, 28, 0.65);
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 10px;
        }

        .item-num {
            font-weight: 800;
            color: var(--cyan);
            font-size: 15px;
            min-width: 20px;
            font-family: 'Space Grotesk', 'Cairo', sans-serif;
        }

        .item-text {
            font-size: 14px;
            color: var(--text-main);
        }

        .sub-item {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            padding-right: 28px;
            padding-left: 28px;
            font-size: 13.5px;
            color: var(--text-muted);
        }

        .bullet {
            color: var(--cyan);
            font-size: 10px;
            margin-top: 6px;
        }

        /* Apps Grid */
        .apps-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
        }

        .app-card {
            background: rgba(14, 18, 28, 0.75);
            border: 1px solid rgba(0, 210, 255, 0.12);
            border-radius: 12px;
            padding: 14px 18px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .app-title {
            font-weight: 700;
            font-size: 15px;
            color: var(--text-heading);
        }

        .app-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .app-tag {
            font-size: 11px;
            font-weight: 700;
            padding: 3px 9px;
            border-radius: 6px;
        }

        .tag-cyan {
            background: rgba(0, 210, 255, 0.12);
            color: var(--cyan);
            border: 1px solid rgba(0, 210, 255, 0.28);
        }

        .tag-crimson {
            background: rgba(255, 45, 85, 0.12);
            color: var(--crimson);
            border: 1px solid rgba(255, 45, 85, 0.28);
        }

        .tag-default {
            background: rgba(148, 163, 184, 0.08);
            color: var(--text-muted);
            border: 1px solid rgba(148, 163, 184, 0.18);
        }

        /* Critical Alerts & Callouts */
        .callout {
            border-radius: 12px;
            padding: 14px 18px;
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 14px;
            line-height: 1.6;
        }

        .callout-crimson {
            background: rgba(255, 45, 85, 0.08);
            border: 1px solid rgba(255, 45, 85, 0.35);
            color: #FFB3C0;
            box-shadow: 0 0 15px rgba(255, 45, 85, 0.12);
        }

        .callout-icon {
            font-size: 20px;
            flex-shrink: 0;
        }

        /* Footer with Aero Suite branding */
        .footer-card {
            background: rgba(10, 14, 22, 0.95);
            border: 1px solid var(--card-border);
            border-radius: var(--card-radius);
            padding: 24px 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            text-align: center;
            box-shadow: 0 16px 35px rgba(0, 0, 0, 0.7);
        }

        .footer-top {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .aero-brand-logo.mini .aero-bolt-svg {
            width: 18px;
            height: 18px;
        }

        .aero-brand-logo.mini .aero-brand-text {
            font-size: 15px;
            letter-spacing: 1px;
        }

        .footer-brand {
            font-size: 14px;
            color: var(--text-main);
            font-family: 'Space Grotesk', 'Cairo', sans-serif;
        }

        .footer-author {
            font-size: 13px;
            color: var(--text-muted);
        }

        .footer-author span {
            color: var(--text-heading);
            font-weight: 700;
        }

        .footer-contact {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            margin-top: 4px;
        }

        .contact-pill {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(0, 210, 255, 0.15);
            color: var(--text-muted);
            text-decoration: none;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            transition: all 0.25s ease;
        }

        .contact-pill:hover {
            background: rgba(0, 210, 255, 0.15);
            color: var(--cyan);
            border-color: rgba(0, 210, 255, 0.4);
            box-shadow: 0 0 12px rgba(0, 210, 255, 0.2);
        }

        @media (max-width: 600px) {
            .header-card {
                padding: 20px;
            }
            .meta-grid {
                grid-template-columns: 1fr;
            }
        }

        @media print {
            body {
                background: #FFFFFF !important;
                color: #000000 !important;
            }
            .card, .header-card, .step-card, .meta-chip {
                background: #FFFFFF !important;
                border: 1px solid #CCCCCC !important;
                color: #000000 !important;
                box-shadow: none !important;
            }
            .header-title, .section-title, .meta-value, .step-text {
                color: #000000 !important;
            }
        }
    </style>
</head>
<body>
    <div class="wrapper">
        <header class="header-card">
            <div class="header-content">
                <div class="aero-brand-logo">
                    <svg class="aero-bolt-svg" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M13 2L3 14H12L11 22L21 10H12L13 2Z" fill="url(#boltGrad)" stroke="#FFA048" stroke-width="0.5" stroke-linejoin="round"/>
                        <defs>
                            <linearGradient id="boltGrad" x1="12" y1="2" x2="12" y2="22" gradientUnits="userSpaceOnUse">
                                <stop stop-color="#FFB347"/>
                                <stop offset="1" stop-color="#FF5252"/>
                            </linearGradient>
                        </defs>
                    </svg>
                    <span class="aero-brand-text">AERO SUITE</span>
                </div>
                <h1 class="header-title">{{ title_display }}</h1>
                <div class="header-sub">{{ subtitle_car }}</div>
            </div>
        </header>

        {{ meta_chips_html }}

        {{ rendered_sections }}

        <footer class="footer-card">
            <div class="footer-top">
                <div class="aero-brand-logo mini">
                    <svg class="aero-bolt-svg mini" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M13 2L3 14H12L11 22L21 10H12L13 2Z" fill="url(#boltGradFooter)" stroke="#FFA048" stroke-width="0.5" stroke-linejoin="round"/>
                        <defs>
                            <linearGradient id="boltGradFooter" x1="12" y1="2" x2="12" y2="22" gradientUnits="userSpaceOnUse">
                                <stop stop-color="#FFB347"/>
                                <stop offset="1" stop-color="#FF5252"/>
                            </linearGradient>
                        </defs>
                    </svg>
                    <span class="aero-brand-text mini">AERO SUITE</span>
                </div>
                <div class="footer-sub">{{ subtitle_car }}</div>
            </div>
            <div class="footer-author">
                {{ dev_lead }} <span>{{ dev_name }}</span>
            </div>
            <div class="footer-contact">
                <a href="mailto:{{ dev_email }}" class="contact-pill">✉️ {{ dev_email }}</a>
                <a href="tel:{{ dev_phone }}" class="contact-pill">📞 {{ dev_phone }}</a>
            </div>
        </footer>
    </div>
</body>
</html>
